# This config file is used by ros2_control (demo / FakeSystem mode)
controller_manager:
  ros__parameters:
    update_rate: 25  # Hz — throttled for Katana KNI serial protocol

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - katana_motor1_pan_joint
      - katana_motor2_lift_joint
      - katana_motor3_lift_joint
      - katana_motor4_lift_joint
      - katana_motor5_wrist_roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

gripper_controller:
  ros__parameters:
    joints:
      - katana_l_finger_joint
      - katana_r_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity