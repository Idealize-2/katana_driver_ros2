controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

arm_controller:
  ros__parameters:
    joints:
      - katana_motor1_pan_joint
      - katana_motor2_lift_joint
      - katana_motor3_lift_joint
      - katana_motor4_lift_joint
      - katana_motor5_wrist_roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      goal_time: 5.0
      katana_motor1_pan_joint:        { goal: 0.15 }
      katana_motor2_lift_joint:       { goal: 0.15 }
      katana_motor3_lift_joint:       { goal: 0.15 }
      katana_motor4_lift_joint:       { goal: 0.15 }
      katana_motor5_wrist_roll_joint: { goal: 0.15 }

gripper_controller:
  ros__parameters:
    joint: katana_l_finger_joint
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    max_effort: 10.0
    allow_stalling: false
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ['base_left_wheel_joint']
    right_wheel_names: ['base_right_wheel_joint']
    wheel_separation: 0.45
    wheel_radius: 0.1
    odom_frame_id: odom
    base_frame_id: base_footprint
    use_stamped_vel: true
    enable_odom_tf: true
    publish_rate: 50.0
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
