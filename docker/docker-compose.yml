version: '3.8'

services:
  katana_system:
    build:
      context: ..               # Tells Docker to look one folder up (katana_driver_ros2/)
      dockerfile: docker/Dockerfile # Tells Docker where the Dockerfile actually is
    image: katana_driver_ros2:jazzy
    container_name: katana_driver_container
    network_mode: "host"
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
